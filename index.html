    <article id="create-modal" class="modal toggle-modal">

        <div class="modal__container">

            <header class="modal__header">

                <button id="close-create-todo" class="modal__button-close button">

                    <svg class="todo-form__icon button-icon--close">
                        <use href="icons.svg#close"></use>
                    </svg>

                </button>

                <h2 class="new-todo-form__heading">Novo Item</h2>

            </header>

            <main class="modal__body">
                <form id="new-todo-form" class="new-todo-form">
                    <input type="text" name="newTaskInput" id="new-todo-input" placeholder="Adicionar novo item..."
                        class="new-todo-form__input">
                </form>
            </main>

            <footer class="modal__footer">

                <button type="submit" form="new-todo-form" class="new-todo-form__submit-button button">
                    <span class="new-todo-form__submit-button-label">
                        Criar novo item
                    </span>

                    <svg class="todo-form__icon button-icon">
                        <use href="icons.svg#add"></use>
                    </svg>
                </button>

            </footer>
        </div>

    </article>

    <header class="app-header">

        <div class="logo">
            <img src="free_todo_logo.svg" alt="Logo App" class="logo__img">
        </div>

        <button class="new-task-button button">

            <svg class="new-task-button__icon button-icon">
                <use href="icons.svg#add"></use>
            </svg>

        </button>

    </header>

    <main class="todo-app">

        <ul class="todo-list">

        </ul>

    </main>
