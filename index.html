<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hands On</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
  
    <article id="create-modal" class="modal hidden">

        <div class="modal__container">

            <header class="modal__header">

                <button id="close-create-todo" class="modal__button-close button bg-gray">

                    <svg class="action-modal-icon">
                        <use href="/icons.svg#close"></use>
                    </svg>

                </button>

                <h2 class="new-todo-form__heading">Novo Item</h2>

            </header>

            <main class="modal__body">
                <form id="new-todo-form" class="new-todo-form">
                    <input type="text" name="newTaskInput" id="new-todo-input" placeholder="Adicionar novo item..."
                        class="new-todo-form__input">
                </form>
            </main>

            <footer class="modal__footer">

                <button type="submit" form="new-todo-form" class="new-todo-form__submit-button button bg-blue">
                    <span class="new-todo-form__submit-button-label">
                        Criar novo item
                    </span>

                    <svg class="action-modal-icon button-icon">
                        <use href="/icons.svg#add"></use>
                    </svg>

                </button>

            </footer>
        </div>

    </article>

    <header class="app-header">

        <div class="logo">
            <img src="free_todo_logo.svg" alt="Logo App" class="logo__img">
        </div>

        <button class="new-todo-button button bg-blue">

            <svg class="new-todo-button__icon button-icon">
                <use href="/icons.svg#add"></use>
            </svg>

        </button>

    </header>

    <main class="todo-app">

        <article class="todo-app__empty-notice">
            <img src="empty-img.png" alt="" class="todo-app__empty-img">
            <p class="todo-app__empty-message"><i>Hora de adicionar algo novo!</i></p>
        </article>

        <ul class="todo-list">           

        </ul>

    </main>

    <script src="script.js"></script>
    
</body>

</html>
