<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Todo</title>

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <article id="create-todo-modal" class="create-todo-modal is-hidden">

        <div class="create-todo-modal__container">

            <header class="create-todo-modal__header">

                <button id="close-create-todo" class="button button--close button--secondary">

                    <svg class="icon-sm">
                        <use href="/icons.svg#close"></use>
                    </svg>

                </button>

                <h2 class="create-todo-modal__heading">Novo Item</h2>

            </header>

            <main class="create-todo-modal__body">
                <form id="new-todo-form" class="create-todo-modal__form" autocomplete="off">
                    <input type="text" name="newTaskInput" id="new-todo-input" placeholder="Adicionar novo item..."
                        class="create-todo-modal__input">
                </form>
            </main>

            <footer class="create-todo-modal__footer">

                <button type="submit" form="new-todo-form" class="button button--submit button--primary">
                    <span class="label label--upper label--primary">
                        Criar novo item
                    </span>

                    <svg class="icon-sm icon--primary">
                        <use href="/icons.svg#add"></use>
                    </svg>

                </button>

            </footer>
        </div>

    </article>

    <header class="app-header">

        <div class="logo">
            <img src="free_todo_logo.svg" alt="Logo App" class="logo__img">
        </div>

        <button class="button button--new-todo button--primary">

            <svg class="icon icon--primary">
                <use href="/icons.svg#add"></use>
            </svg>

        </button>

    </header>

    <main class="todo-app">

        <article class="todo-app__empty-notice">
            <img src="empty-img.png" alt="" class="todo-app__empty-img">
            <p class="todo-app__empty-message"><i>Hora de adicionar algo novo!</i></p>
        </article>

        <ul class="todo-list">

        </ul>

    </main>

    <script src="script.js"></script>

</body>

</html>
